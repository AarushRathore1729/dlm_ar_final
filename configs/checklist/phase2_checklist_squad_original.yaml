# SQuAD CheckList – original suite (24 tests, 13K cases)
# Uses predictor-wrapper mode: model response IS the prediction (no judge).

experiment:
  name: phase2_checklist_squad_original
  output_dir: results/checklist/squad/baseline

models:
  - name: GSAI-ML/LLaDA-8B-Instruct
    type: llada
    device: auto
    sampling_steps: 8
    model_kwargs:
      torch_dtype: bfloat16
      block_length: 32
      remasking: low_confidence

  - name: meta-llama/Llama-3.1-8B-Instruct
    type: ar
    device: auto
    model_kwargs:
      torch_dtype: bfloat16

checklist:
  task: squad
  suite_path: results/checklist/suites/squad_suite_original_dump.json
  official_run_from_file: false
  max_new_tokens: 32
  batch_size: 8
  task_prompt_template: |
    Read the passage and answer the question.
    Output exactly one answer span copied verbatim from the passage.
    Do not explain.
    Do not answer in a full sentence.
    Do not repeat the question.
    Do not add any words that are not in the passage.
    Do not use quotes or prefixes like "Answer:".
    If the answer is a short phrase, output only that phrase.

    Passage: {passage}
    Question: {question}
    Answer:
