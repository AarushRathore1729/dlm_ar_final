# Sentiment CheckList – final rerun with corrected expectations, Llama only

experiment:
  name: phase2_checklist_sentiment_rerun_llama
  output_dir: results/checklist/sentiment/llama_rerun_fixed

models:
  - name: meta-llama/Llama-3.1-8B-Instruct
    type: ar
    device: auto
    model_kwargs:
      torch_dtype: bfloat16

checklist:
  task: sentiment
  labels: [negative, neutral, positive]
  fallback_label: neutral
  suite_path: results/checklist/suites/sentiment_suite_original_dump.json
  official_run_from_file: false
  max_new_tokens: 4
  batch_size: 8
  task_prompt_template: |
    You are a strict sentiment classifier.
    Read the text and classify its sentiment.
    Reply with exactly one lowercase label: negative, neutral, or positive.
    Do not explain your answer.
    Do not output any other words, punctuation, or formatting.

    Text: {text}
    Sentiment:
  judge_prompt_template: |
    Output exactly one label (in lowercase): negative , neutral , or positive .
    Do not output anything else.

    Original text: {text}
    Model response: {response}
  use_sentiment_pipeline: true
  sentiment_pipeline_parse_direct_labels: true
  pipeline_model: cardiffnlp/twitter-roberta-base-sentiment-latest
