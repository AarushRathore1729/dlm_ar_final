experiment:
  name: expansion_dream_qqp_rerun
  output_dir: results/expansion/checklist/qqp/dream_rerun

# Rerun of the broken dream_qqp.yaml (80% bare-period outputs from under-denoising).
# ONLY the decoder budget changes vs counterparts; the task prompt, labels,
# max_new_tokens (16) and judge are IDENTICAL to gemma/qwen/mistral/olmo/llada_moe
# QQP so the result stays experiment-comparable.
#   sampling_steps: 8 -> 64   (LLaDA-equivalent density; >= 2 x max_new_tokens)
#   batch_size:    64 -> 4    (smaller batch, less padding interaction)
# The model code (dream_model.py) now also floors steps at 2x max_new_tokens and
# warns on degenerate output, so this can no longer recur silently.

models:
  - name: Dream-org/Dream-v0-Instruct-7B
    type: dream
    device: auto
    sampling_steps: 64
    model_kwargs:
      torch_dtype: bfloat16

checklist:
  task: qqp
  labels: [not_duplicate, duplicate]
  fallback_label: not_duplicate
  suite_path: results/checklist/suites/qqp_suite_original_dump.json
  official_run_from_file: false
  max_new_tokens: 16
  batch_size: 4
  task_prompt_template: |
    Determine whether the following two questions are duplicates. Reply with exactly one label: duplicate or not_duplicate.

    Question 1: {question1}
    Question 2: {question2}
  judge_prompt_template: |
    You are evaluating a duplicate-question classifier.
    Original pair: "{text}"
    The model response: "{response}"
    Reply with exactly one label from: {label_list}
  use_sentiment_pipeline: false
  judge:
    name: Qwen/Qwen2.5-1.5B-Instruct
    type: ar
    device: auto
    model_kwargs:
      torch_dtype: bfloat16
