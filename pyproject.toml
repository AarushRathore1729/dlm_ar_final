[project]
name = "dlm-safety"
version = "0.1.0"
description = "Safety Analysis of Diffusion Language Models with CheckList behavioral evaluation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Anonymous" },
]

dependencies = [
    "torch",
    "transformers",
    "datasets",
    "hydra-core",
    "omegaconf",
    "tqdm",
    "pandas",
    "matplotlib",
    "lightning",
    "sentencepiece",
    "protobuf",
    "tiktoken",
    "safetensors",
    "accelerate",
    "einops",
]

[project.optional-dependencies]
dev = [
    "ipykernel",
    "jupyter",
    "pytest",
]
checklist = [
    "jupyter",
    "checklist",
]
analysis = [
    "sentence-transformers",
    "scikit-learn",
    "umap-learn",
    "seaborn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dlm_safety"]

[tool.pytest.ini_options]
testpaths = ["tests"]
